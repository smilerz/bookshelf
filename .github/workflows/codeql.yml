name: Code scanning

# CodeQL baseline on the default branch, on pull requests, and weekly (same shape as smilerz/recipes).
# C# and JavaScript/TypeScript are analyzed from source without a build.
on:
  push:
    branches: [integration]
  pull_request:
    branches: [integration]
  schedule:
    - cron: '0 13 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
