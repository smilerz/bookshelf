# Dependency updates, following the conventions of smilerz/recipes: grouped minor/patch updates, a cooldown so a
# freshly published release is not adopted the day it appears, a `chore` commit prefix, and labels.
# Major versions stay ungrouped so each gets its own pull request and CI run.
version: 2

updates:
  - package-ecosystem: "nuget"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    directory: "/src"
    groups:
      nuget-patches:
        patterns: ["*"]
        update-types: ["patch"]
      nuget-minors:
        patterns: ["*"]
        update-types: ["minor"]
    ignore:
      # The code targets net6.0. Major bumps of Microsoft.* and related packages require a newer target
      # framework, so hold majors back until the runtime upgrade (issue #13) lands, then remove this entry.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "nuget"
      - "dependencies"

  - package-ecosystem: "npm"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    directory: "/"
    groups:
      npm-patches:
        patterns: ["*"]
        update-types: ["patch"]
      npm-minors:
        patterns: ["*"]
        update-types: ["minor"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "javascript"
      - "dependencies"

  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    directory: "/"
    groups:
      actions-updates:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "github_actions"
      - "dependencies"

  - package-ecosystem: "docker"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    directory: "/docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "docker"
      - "dependencies"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "devcontainers"
      - "dependencies"
